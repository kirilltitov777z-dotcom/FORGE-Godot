name: Build FORGE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1 cmdline-tools;latest'

      - name: Download Godot 4.3 and export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -f "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          godot --version

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          echo '[gd_resource type="EditorSettings" format=3]' > "$HOME/.config/godot/editor_settings-4.tres"
          echo '' >> "$HOME/.config/godot/editor_settings-4.tres"
          echo '[resource]' >> "$HOME/.config/godot/editor_settings-4.tres"
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$HOME/.config/godot/editor_settings-4.tres"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$HOME/.config/godot/editor_settings-4.tres"
          echo "export/android/shutdown_adb_on_exit = true" >> "$HOME/.config/godot/editor_settings-4.tres"

      - name: Install Android build template
        run: |
          mkdir -p android/plugins android/build
          touch android/build/.gdignore
          echo "${GODOT_VERSION}.stable" > android/.build_version
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/forge.keystore" \
            -alias forge -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass forge123 -keypass forge123 \
            -dname "CN=FORGE, OU=FORGE, O=FORGE, L=Moscow, ST=Moscow, C=RU"

      - name: Headless runtime smoke test
        run: |
          output=$(timeout 30 godot --headless --path . --quit-after 5 2>&1)
          echo "$output"
          if echo "$output" | grep -q "SCRIPT ERROR"; then
            echo "Runtime script errors detected"
            exit 1
          fi

      - name: Import project and export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/forge.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: forge
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: forge123
        run: |
          timeout 30 godot --headless --path . -e || true
          godot --headless --path . --export-release Android
          ls -lh build/FORGE.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-APK
          path: build/FORGE.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: FORGE v1.0.0
          body: "Минималистичная игра с кейсами, апгрейдом и инвентарём. Монеты виртуальные."
          files: build/FORGE.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
